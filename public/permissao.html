<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Liberar destino do WebHook</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f6f7fb; color: #1a1b26;
        font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      .caixa { width: min(520px, 92vw); background: #fff; border: 1px solid #eaeaf3;
        border-radius: 14px; padding: 28px 30px; box-shadow: 0 8px 30px rgb(0 0 0 / 6%); }
      h1 { margin: 0 0 6px; font-size: 20px; }
      p { margin: 0 0 14px; color: #4b4c5e; }
      code { background: #f2f2f9; padding: 2px 7px; border-radius: 6px; font-size: 14px; }
      button { border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px;
        font-weight: 600; color: #fff; background: #4f46e5; cursor: pointer; }
      button:hover { background: #4338ca; }
      button[disabled] { opacity: .5; cursor: default; }
      .estado { margin-top: 14px; font-size: 14px; }
      .ok { color: #15803d; }
      .erro { color: #b91c1c; }
      @media (prefers-color-scheme: dark) {
        body { background: #14161d; color: #e9edef; }
        .caixa { background: #1c1f27; border-color: #2b303b; }
        p { color: #9aa3b2; } code { background: #2b303b; }
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <h1>Liberar o envio do WebHook</h1>
      <p>
        A extensão precisa da sua autorização para conversar com
        <code id="dominio">este endereço</code>. Sem ela, o Chrome entrega os dados mas esconde a
        resposta — então não dá para saber se o seu sistema recebeu.
      </p>
      <button id="liberar">Liberar acesso</button>
      <div class="estado" id="estado"></div>
    </div>
    <script src="permissao.js"></script>
  </body>
</html>
